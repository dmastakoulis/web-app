version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: student_db
    restart: always
    environment:
      MYSQL_DATABASE: studentdb
      MYSQL_USER: student_user
      MYSQL_PASSWORD: student_pass
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_backend
    restart: on-failure
    environment:
      DB_HOST: db
      DB_NAME: studentdb
      DB_USER: student_user
      DB_PASSWORD: student_pass
      DB_PORT: 3306
      DJANGO_SECRET_KEY: "django-insecure-student-predictor-secret-key-2025"
      DJANGO_DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_model/saved
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    command: ["python", "startup.py"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_frontend
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: student_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  ml_models:
